[package]
authors = ["Adi Salimgereyev <adisalimgereev@gmail.com>"]
categories = ["web-programming::http-server", "cryptography"]
description = "Automatic TLS certificates for axum-server through ACME (for example Let's Encrypt)."
edition = "2021"
homepage = "https://github.com/abs0luty/axum-server-acme"
keywords = ["acme", "axum", "letsencrypt", "server", "tls"]
license = "MIT"
name = "axum-server-acme"
readme = "README.md"
repository = "https://github.com/abs0luty/axum-server-acme"
rust-version = "1.82"
version = "0.1.1"

[dependencies]
axum-server = { version = "0.9.2", default-features = false, features = ["tls-rustls"] }
http = "1"
hyper = { version = "1.4", features = ["client", "http1", "server"] }
rustls = { version = "0.23", default-features = false }
rustls-acme = { version = "0.15.4", default-features = false, features = [
    "aws-lc-rs",
    "tls12",
    "webpki-roots",
] }
tokio = { version = ">=1.41", features = ["time"] }
tokio-rustls = { version = "0.26", default-features = false }
tower-service = "0.3"

[dev-dependencies]
axum = "0.8"
futures-util = { version = "0.3", default-features = false }
http-body-util = "0.1"
hyper-util = { version = "0.1.18", features = ["server", "tokio"] }
tokio = { version = ">=1.41", features = ["full"] }

[[example]]
name = "acme"
doc-scrape-examples = true
